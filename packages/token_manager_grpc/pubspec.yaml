name: token_manager_grpc
description: "Single-flight OAuth/JWT refresh for gRPC: an interceptor that attaches the access token, refreshes once on UNAUTHENTICATED and replays the call."
version: 0.2.1
repository: https://github.com/4akloon/dart_token_manager/tree/main/packages/token_manager_grpc
homepage: https://github.com/4akloon/dart_token_manager
issue_tracker: https://github.com/4akloon/dart_token_manager/issues
topics:
  - grpc
  - authentication
  - interceptor
  - oauth
  - refresh-token

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  async: ">=2.11.0 <3.0.0"
  grpc: ">=3.2.0 <6.0.0"
  token_manager: ^0.2.0

dev_dependencies:
  test: ^1.31.0
