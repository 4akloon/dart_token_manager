name: token_manager_http
description: "Single-flight OAuth/JWT refresh for package:http: a Client that attaches the access token, refreshes once on 401 and replays the request."
version: 0.1.2
repository: https://github.com/4akloon/dart_token_manager/tree/main/packages/token_manager_http
homepage: https://github.com/4akloon/dart_token_manager
issue_tracker: https://github.com/4akloon/dart_token_manager/issues
topics:
  - http
  - authentication
  - oauth
  - refresh-token
  - jwt

environment:
  sdk: ^3.10.0

resolution: workspace

# http 1.5.0 added Abortable, AbortableRequest and AbortableStreamedRequest:
# the client keeps the abort trigger of a request on the copy it sends.
dependencies:
  http: ^1.5.0
  token_manager: ^0.2.0

dev_dependencies:
  test: ^1.31.0
