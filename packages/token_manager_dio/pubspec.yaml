name: token_manager_dio
description: "Single-flight OAuth/JWT refresh for Dio: attaches the access token, refreshes once on 401 and replays the request."
version: 0.2.1
repository: https://github.com/4akloon/dart_token_manager/tree/main/packages/token_manager_dio
homepage: https://github.com/4akloon/dart_token_manager
issue_tracker: https://github.com/4akloon/dart_token_manager/issues
topics:
  - dio
  - authentication
  - interceptor
  - oauth
  - refresh-token

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  dio: ">=5.3.1 <6.0.0"

  token_manager: ^0.2.0

dev_dependencies:
  test: ^1.31.0
